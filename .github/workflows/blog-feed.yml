name: Update blog feed

on:
  schedule:
    - cron: "30 21 * * *"   # 매일 06:30 KST
  workflow_dispatch:         # 수동 실행 버튼
  push:
    branches: [main]
    paths:
      - "scripts/update_blog_feed.py"
      - "scripts/build_topics.py"
      - "scripts/topics_config.py"
      - "scripts/build_columns.py"
      - "scripts/apply_nav.py"
      - "data/columns.json"
      - ".github/workflows/blog-feed.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest blog posts into index.html
        run: python3 scripts/update_blog_feed.py

      - name: Rebuild topic hub pages (원장 칼럼 자동 분류)
        run: python3 scripts/build_topics.py

      - name: Rebuild 칼럼 page (/columns/)
        run: python3 scripts/build_columns.py

      - name: Apply site-wide top menu (모든 페이지 공통 메뉴)
        run: python3 scripts/apply_nav.py

      - name: Commit if changed
        run: |
          git add -A index.html about hours night notes faq event facial-palsy trigeminal-neuralgia blog columns data rhinitis women postpartum car-accident pain digestion skin diet treatments
          if ! git diff --cached --quiet; then
            git config user.name "jeein-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: update blog feed [skip ci]"
            git push
          else
            echo "feed unchanged"
          fi
