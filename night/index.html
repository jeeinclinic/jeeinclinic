<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- '야간 증상 가이드'는 생활한방노트(/notes/#night)로 합쳐졌습니다. 옛 주소로 들어온 방문자를 이동시키는 안내 페이지입니다. -->
<title>생활한방노트로 이동합니다 | 부천 지인한의원</title>
<link rel="canonical" href="https://jeeinclinic.com/notes/">
<meta http-equiv="refresh" content="0; url=/notes/#night">
<meta name="robots" content="noindex, follow">
<script>
  var h = location.hash ? location.hash.replace('#', '') : '';
  location.replace('/notes/#' + (/^c[1-5]$/.test(h) ? 'night-' + h : 'night'));
</script>
</head>
<body style="font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;background:#F3F0E4;color:#22271F;padding:40px 22px;line-height:1.8">
<p>야간 증상 가이드는 <a href="/notes/#night">생활한방노트</a>로 옮겼습니다. 자동으로 이동하지 않으면 링크를 눌러 주세요.</p>
</body>
</html>
